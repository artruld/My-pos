<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ร้านปลาเม้า - ระบบออกบิลเงินสด</title>
  <!-- React & Tailwind CSS -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas แปลงสลิปเป็นรูปภาพ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Kanit Font -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    /* สไตล์สำหรับการสั่งพิมพ์สลิป */
    @media print {
      body * { visibility: hidden; }
      #receipt-slip, #receipt-slip * { visibility: visible; }
      #receipt-slip {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden select-none p-3">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState } = React;

    function POSApp() {
      const customers = ['หน้าร้าน', 'เฮียบ๊อบ', 'เฮียเสม'];
      
      // รายการสินค้า (เอา defaultPrice ออกแล้ว)
      const products = [
        { id: 1, name: 'ปลาดุก', unit: 'กก.' },
        { id: 2, name: 'ปลาช่อน', unit: 'กก.' },
        { id: 3, name: 'ปลานิล', unit: 'กก.' },
        { id: 4, name: 'เกลือ', unit: 'ถุง' },
      ];

      const [selectedCustomer, setSelectedCustomer] = useState('หน้าร้าน');
      const [cart, setCart] = useState([]);
      const [showSuccess, setShowSuccess] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);

      // Modal State สำหรับระบุน้ำหนักและราคา
      const [activeProduct, setActiveProduct] = useState(null);
      const [weightInput, setWeightInput] = useState('');
      const [priceInput, setPriceInput] = useState('');

      const todayDate = new Date().toLocaleDateString('th-TH', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });

      const currentTime = new Date().toLocaleTimeString('th-TH', {
        hour: '2-digit',
        minute: '2-digit'
      });

      // เปิด Pop-up พร้อมล้างค่าให้เป็นว่างเปล่าเพื่อรอคีย์
      const handleSelectProduct = (product) => {
        setActiveProduct(product);
        setWeightInput('');
        setPriceInput('');
      };

      // บันทึกรายการลงบิล
      const handleAddToCart = () => {
        if (!activeProduct) return;
        
        const weight = parseFloat(weightInput) || 0;
        const price = parseFloat(priceInput) || 0;

        if (weight <= 0 || price <= 0) {
          alert('กรุณากรอกน้ำหนักและราคาให้ครบถ้วนถูกต้อง');
          return;
        }

        const newItem = {
          cartItemId: Date.now(),
          id: activeProduct.id,
          name: activeProduct.name,
          unit: activeProduct.unit,
          weight: weight,
          pricePerUnit: price,
          total: weight * price
        };

        setCart(prev => [...prev, newItem]);
        setActiveProduct(null);
      };

      // ลบรายการ
      const removeItem = (cartItemId) => {
        setCart(prev => prev.filter(item => item.cartItemId !== cartItemId));
      };

      const totalPrice = cart.reduce((sum, item) => sum + item.total, 0);

      // ฟังก์ชัน พิมพ์ / แชร์ / บันทึก
      const handlePrint = () => {
        if (cart.length === 0) return;
        window.print();
      };

      const handleShareReceiptImage = async () => {
        const receiptElement = document.getElementById('receipt-slip');
        if (!receiptElement || cart.length === 0) return;

        setIsGenerating(true);

        try {
          const canvas = await html2canvas(receiptElement, {
            scale: 3,
            backgroundColor: '#ffffff',
            useCORS: true
          });

          canvas.toBlob(async (blob) => {
            if (!blob) {
              setIsGenerating(false);
              return;
            }

            const fileName = `Slip-ร้านปลาเม้า-${selectedCustomer}.png`;
            const file = new File([blob], fileName, { type: 'image/png' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: 'บิลเงินสด ร้านปลาเม้า',
                text: `บิลเงินสด ร้านปลาเม้า - คุณ ${selectedCustomer}`,
              });
            } else {
              const link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = fileName;
              link.click();
            }
            setIsGenerating(false);
          }, 'image/png');
        } catch (error) {
          console.error(error);
          alert('ไม่สามารถสร้างรูปภาพได้ กรุณาลองใหม่อีกครั้ง');
          setIsGenerating(false);
        }
      };

      const handleSave = () => {
        if (cart.length === 0) return;
        setShowSuccess(true);
        setTimeout(() => {
          setShowSuccess(false);
          setCart([]);
          setSelectedCustomer('หน้าร้าน');
        }, 1200);
      };

      return (
        <div class="h-full flex flex-col justify-between max-w-[1280px] mx-auto">
          {/* Header */}
          <header class="bg-blue-600 text-white p-3 rounded-2xl shadow-md flex justify-between items-center mb-3">
            <div class="flex items-center space-x-3">
              <span class="text-3xl">🐟</span>
              <div>
                <h1 class="text-2xl font-bold leading-tight">ร้านปลาเม้า</h1>
                <p class="text-blue-100 text-xs">ระบบออกบิลหน้าร้าน (iPad Mode)</p>
              </div>
            </div>
            <div class="text-right text-xs bg-blue-700 px-3 py-1.5 rounded-xl font-medium">
              <div>📅 {todayDate}</div>
              <div>⏰ {currentTime} น.</div>
            </div>
          </header>

          {/* Main Content (iPad Split Screen) */}
          <div class="grid grid-cols-12 gap-4 flex-1 overflow-hidden">
            
            {/* ฝั่งซ้าย: เลือกลูกค้า & เลือกสินค้า (7 คอลัมน์) */}
            <div class="col-span-7 flex flex-col space-y-3 h-full overflow-y-auto pr-1">
              
              {/* เลือกลูกค้า */}
              <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-md font-bold text-gray-700 mb-2">1. เลือกลูกค้า</h2>
                <div class="grid grid-cols-3 gap-2">
                  {customers.map(cust => (
                    <button
                      key={cust}
                      onClick={() => setSelectedCustomer(cust)}
                      class={`py-3 text-lg font-bold rounded-xl border-2 transition-all ${
                        selectedCustomer === cust
                          ? 'bg-blue-600 text-white border-blue-600 shadow-md'
                          : 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-gray-100'
                      }`}
                    >
                      {cust}
                    </button>
                  ))}
                </div>
              </div>

              {/* เลือกสินค้า */}
              <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 flex-1">
                <h2 class="text-md font-bold text-gray-700 mb-2">2. กดเลือกสินค้า (คีย์น้ำหนักและราคา)</h2>
                <div class="grid grid-cols-2 gap-3">
                  {products.map(prod => (
                    <button
                      key={prod.id}
                      onClick={() => handleSelectProduct(prod)}
                      class="bg-emerald-50 border-2 border-emerald-500 hover:bg-emerald-100 p-6 rounded-2xl flex flex-col items-center justify-center transition-all active:scale-95 shadow-sm"
                    >
                      <span class="text-3xl font-extrabold text-emerald-950">{prod.name}</span>
                      <span class="text-sm text-emerald-700 font-semibold mt-1">หน่วย: {prod.unit}</span>
                    </button>
                  ))}
                </div>
              </div>

            </div>

            {/* ฝั่งขวา: Layout สลิปบิลเงินสด ออกแบบตามรูปภาพตัวอย่าง (5 คอลัมน์) */}
            <div class="col-span-5 flex flex-col justify-between h-full bg-white p-4 rounded-2xl border-2 border-blue-100 shadow-sm overflow-hidden">
              
              {/* ตัวสลิปใบเสร็จ (Layout ถอดแบบจาก FlowAccount Sample) */}
              <div id="receipt-slip" class="bg-white p-5 rounded-xl border border-gray-300 font-sans text-gray-800 space-y-3 flex-1 overflow-y-auto">
                
                {/* 1. Header ร้าน */}
                <div class="text-center space-y-1 pb-2">
                  <div class="flex justify-center mb-1">
                    <div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center text-xl font-bold">
                      🐟
                    </div>
                  </div>
                  <h2 class="text-xl font-bold tracking-wide text-black">ร้านปลาเม้า</h2>
                  <p class="text-xs text-gray-500">ตลาดสด / หน้าร้านขายปลา</p>
                </div>

                <div class="border-b border-gray-300"></div>

                {/* 2. หัวข้อสลิป และ ข้อมูลบิล */}
                <div class="space-y-1 text-sm">
                  <div class="font-bold text-center text-gray-800 py-1">
                    ใบเสร็จรับเงิน / บิลเงินสด
                  </div>
                  <div class="flex justify-between text-xs text-gray-600 pt-1">
                    <span>ลูกค้า: <strong class="text-gray-900">{selectedCustomer}</strong></span>
                    <span>วันที่: {todayDate}</span>
                  </div>
                </div>

                <div class="border-b border-dashed border-gray-300"></div>

                {/* 3. ตารางรายการสินค้า (รูปแบบ [จำนวน/น้ำหนัก] [รายการ] [ราคารวม]) */}
                <div class="min-h-[140px]">
                  {cart.length === 0 ? (
                    <div class="text-center py-12 text-gray-400 text-sm">
                      👈 กดเลือกสินค้าเพื่อเริ่มออกบิล
                    </div>
                  ) : (
                    <div class="space-y-2 text-sm pt-1">
                      {cart.map(item => (
                        <div key={item.cartItemId} class="flex items-center justify-between hover:bg-gray-50 p-1 rounded">
                          {/* ฝั่งซ้าย: จำนวน/น้ำหนัก + ชื่อสินค้า */}
                          <div class="flex items-center space-x-2 flex-1 pr-2">
                            <span class="font-bold w-12 text-right text-gray-700">{item.weight}</span>
                            <span class="font-medium text-gray-900">{item.name} ({item.pricePerUnit}฿)</span>
                          </div>

                          {/* ฝั่งขวา: ยอดรวม + ปุ่มลบ */}
                          <div class="flex items-center space-x-2">
                            <span class="font-bold text-gray-900 w-20 text-right">
                              {item.total.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                            </span>
                            <button 
                              onClick={() => removeItem(item.cartItemId)}
                              class="no-print text-red-400 hover:text-red-600 font-bold px-1"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div class="border-b border-dashed border-gray-300"></div>

                {/* 4. สรุปยอดเงินล่างสลิป (ตามทรง Layout ตัวอย่าง) */}
                <div class="space-y-1.5 text-sm pt-1">
                  <div class="flex justify-between text-gray-600">
                    <span>จำนวนรายการรวม</span>
                    <span class="font-bold text-gray-800">{cart.length} รายการ</span>
                  </div>

                  <div class="flex justify-between text-gray-600">
                    <span>รวมเป็นเงิน</span>
                    <span class="font-bold text-gray-800">
                      {totalPrice.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} บาท
                    </span>
                  </div>

                  <div class="border-b border-gray-200 my-1"></div>

                  <div class="flex justify-between items-center text-lg font-bold text-black pt-1">
                    <span>รวมทั้งสิ้น</span>
                    <span class="text-2xl font-extrabold border-b-4 border-double border-black pb-0.5">
                      {totalPrice.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                    </span>
                  </div>
                </div>

                {/* 5. ท้ายสลิป */}
                <div class="text-center text-xs text-gray-400 pt-4 pb-1">
                  *** ขอบคุณที่อุดหนุน ร้านปลาเม้า ***
                </div>

              </div>

              {/* ปุ่ม 3 ปุ่มควบคุมหลักใต้สลิป */}
              <div class="grid grid-cols-3 gap-2 mt-3 pt-2 border-t no-print">
                <button
                  onClick={handlePrint}
                  disabled={cart.length === 0}
                  class={`py-3 px-1 text-sm font-bold rounded-xl flex flex-col items-center justify-center space-y-1 shadow ${
                    cart.length === 0
                      ? 'bg-gray-200 text-gray-400'
                      : 'bg-blue-600 text-white hover:bg-blue-700 active:scale-95'
                  }`}
                >
                  <span class="text-xl">🖨️</span>
                  <span>พิมพ์ใบเสร็จ</span>
                </button>

                <button
                  onClick={handleShareReceiptImage}
                  disabled={cart.length === 0 || isGenerating}
                  class={`py-3 px-1 text-sm font-bold rounded-xl flex flex-col items-center justify-center space-y-1 shadow ${
                    cart.length === 0 || isGenerating
                      ? 'bg-gray-200 text-gray-400'
                      : 'bg-green-500 text-white hover:bg-green-600 active:scale-95'
                  }`}
                >
                  <span class="text-xl">📸</span>
                  <span>{isGenerating ? 'สร้างรูป...' : 'แชร์บิล LINE'}</span>
                </button>

                <button
                  onClick={handleSave}
                  disabled={cart.length === 0}
                  class={`py-3 px-1 text-sm font-bold rounded-xl flex flex-col items-center justify-center space-y-1 border-2 ${
                    cart.length === 0
                      ? 'border-gray-200 text-gray-300'
                      : 'border-blue-600 text-blue-600 hover:bg-blue-50 active:scale-95'
                  }`}
                >
                  <span class="text-xl">✅</span>
                  <span>บันทึกล้าง</span>
                </button>
              </div>

            </div>

          </div>

          {/* Pop-up คีย์น้ำหนักและราคา (ตั้งค่าเริ่มต้นเป็นช่องว่างเปล่า) */}
          {activeProduct && (
            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white p-6 rounded-3xl max-w-md w-full shadow-2xl space-y-4 animate-in fade-in zoom-in duration-150">
                
                <div class="flex justify-between items-center border-b pb-2">
                  <h3 class="text-2xl font-bold text-gray-800">
                    🐟 คีย์รายการ: <span class="text-blue-600">{activeProduct.name}</span>
                  </h3>
                  <button 
                    onClick={() => setActiveProduct(null)}
                    class="text-gray-400 hover:text-gray-600 text-2xl font-bold px-2"
                  >
                    ✕
                  </button>
                </div>

                <div class="space-y-4">
                  {/* ช่องระบุน้ำหนัก (ว่างเปล่า) */}
                  <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">
                      ⚖️ น้ำหนัก / จำนวน ({activeProduct.unit})
                    </label>
                    <input
                      type="number"
                      step="0.1"
                      placeholder="0.0"
                      value={weightInput}
                      onChange={(e) => setWeightInput(e.target.value)}
                      class="w-full text-3xl font-extrabold text-center p-3 border-2 border-blue-400 rounded-2xl bg-blue-50 focus:outline-none focus:border-blue-600"
                      autoFocus
                    />
                  </div>

                  {/* ช่องระบุราคาขาย (ว่างเปล่า) */}
                  <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">
                      💵 ราคาขายต่อหน่วย (บาท / {activeProduct.unit})
                    </label>
                    <input
                      type="number"
                      placeholder="0"
                      value={priceInput}
                      onChange={(e) => setPriceInput(e.target.value)}
                      class="w-full text-3xl font-extrabold text-center p-3 border-2 border-gray-300 rounded-2xl bg-gray-50 focus:outline-none focus:border-blue-600"
                    />
                  </div>

                  {/* สรุปเงินอัตโนมัติ */}
                  <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl text-center">
                    <div class="text-xs text-emerald-700 font-bold">ราคารวมคำนวณได้</div>
                    <div class="text-3xl font-extrabold text-emerald-600">
                      {((parseFloat(weightInput) || 0) * (parseFloat(priceInput) || 0)).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} <span class="text-lg">บาท</span>
                    </div>
                  </div>
                </div>

                {/* ปุ่มควบคุม Pop-up */}
                <div class="flex space-x-2 pt-2">
                  <button
                    onClick={() => setActiveProduct(null)}
                    class="w-1/3 py-3.5 text-lg font-bold text-gray-600 bg-gray-100 rounded-2xl hover:bg-gray-200"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={handleAddToCart}
                    class="w-2/3 py-3.5 text-xl font-bold text-white bg-blue-600 rounded-2xl hover:bg-blue-700 shadow-lg active:scale-98"
                  >
                    ➕ ส่งไปบิล
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* แจ้งเตือนเมื่อบันทึกสำเร็จ */}
          {showSuccess && (
            <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div class="bg-white p-8 rounded-3xl text-center space-y-3 shadow-2xl animate-bounce">
                <div class="text-6xl">🎉</div>
                <div class="text-3xl font-bold text-gray-800">บันทึกบิลเรียบร้อย!</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<POSApp />);
  </script>
</body>
</html>
