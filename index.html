<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<meta name="mobile-web-app-capable" content="yes">
<title>POS ร้านปลาเม้า</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3.2.4">
</head>
<body class="bg-slate-100 text-slate-800">
<div id="rot" class="no-print">📱 กรุณาหมุนหน้าจอเป็นแนวนอนเพื่อใช้งาน</div>
<header class="bg-indigo-900 text-white px-4 py-2 flex justify-between items-center no-print">

  <div class="flex gap-2">
    <button class="btn" onclick="settings()">⚙️ ตั้งค่า</button>
    <button id="home" class="hidden btn" onclick="go('home')">🏠 หน้าหลัก</button>
  </div>
</header>
<main id="app" class="p-3 no-print"></main>
<div id="modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 no-print">
  <div id="mbox" class="bg-white rounded-2xl p-5 w-full max-w-md overflow-y-auto"></div>
</div>
<div id="toast" class="hidden fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-3 rounded-xl z-50 font-bold no-print"></div>
<div id="print-area"></div>
<script src="script.js?v=3.2.4"></script>

</html>
