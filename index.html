
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#172554">
  <title>ร้านปลาเม้า | POS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">ร้านปลาเม้า</div>
      <div class="subbrand">ระบบขายสินค้าและบัญชีร้าน</div>
    </div>
    <div class="topbar-right">
      <span id="today"></span>
      <button class="button light" data-action="home">หน้าหลัก</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <button class="nav-button active" data-action="home">⌂ หน้าหลัก</button>
      <button class="nav-button" data-action="sales">▣ ขายสินค้า</button>
      <button class="nav-button" data-action="purchases">↓ ซื้อสินค้าเข้า</button>
      <button class="nav-button" data-action="bills">▤ ประวัติบิล</button>
      <button class="nav-button" data-action="summary">▥ สรุปบัญชี</button>
      <button class="nav-button" data-action="expenses">− รายจ่ายทั่วไป</button>
      <button class="nav-button" data-action="employees">♙ ค่าจ้างพนักงาน</button>
      <div class="nav-divider"></div>
      <button class="nav-button" data-action="customers">♧ ลูกค้าประจำ</button>
      <button class="nav-button" data-action="suppliers">♧ ผู้ขาย / เจ้าหนี้</button>
      <button class="nav-button" data-action="products">▦ จัดการสินค้า</button>
      <button class="nav-button" data-action="settings">⚙ ตั้งค่า</button>
    </aside>

    <main id="app" class="workspace">
      <div class="loading">กำลังเปิดระบบ...</div>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <section class="modal-card">
      <div class="modal-heading">
        <h2 id="modal-title">รายละเอียด</h2>
        <button class="icon-button" data-action="close-modal" aria-label="ปิด">✕</button>
      </div>
      <div id="modal-content"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
  <section id="print-area"></section>

  <script src="script.js"></script>
</body>
</html>
