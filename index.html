<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ร้านปลาเม้า - ระบบบริหารจัดการร้าน POS V.2</title>
  <!-- React & Tailwind CSS -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Kanit Font -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
    @media print {
      body * { visibility: hidden; }
      #printable-slip, #printable-slip * { visibility: visible; }
      #printable-slip {
        position: absolute; left: 0; top: 0; width: 100%;
        border: none !important; box-shadow: none !important; padding: 0 !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="h-screen overflow-hidden select-none text-slate-800">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper ในการอ่าน/เขียน LocalStorage
    const useLocalStorage = (key, initialValue) => {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          return initialValue;
        }
      });
      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(storedValue));
        } catch (error) {}
      }, [key, storedValue]);
      return [storedValue, setStoredValue];
    };

    function MainApp() {
      // Navigation State
      const [currentTab, setCurrentTab] = useState('pos'); // pos, history, purchases, expenses, analytics

      // ===== DATABASES (LocalStorage) =====
      const [customers, setCustomers] = useLocalStorage('pos_customers', [
        { id: 1, name: 'หน้าร้านทั่วไป', isDefault: true },
        { id: 2, name: 'เฮียบ๊อบ', prices: { 1: 75, 2: 110, 3: 65, 4: 10 } },
        { id: 3, name: 'เฮียเสม', prices: { 1: 70, 2: 115, 3: 60, 4: 10 } },
      ]);

      const [suppliers, setSuppliers] = useLocalStorage('pos_suppliers', [
        { id: 1, name: 'แพปลาเจ๊นก (แม่กลอง)' },
        { id: 2, name: 'ฟาร์มปลาดุกเฮียชัย' },
      ]);

      const [employees, setEmployees] = useLocalStorage('pos_employees', [
        { id: 1, name: 'สมชาย', dailyWage: 400 },
        { id: 2, name: 'สมหญิง', dailyWage: 350 },
      ]);

      const [salesHistory, setSalesHistory] = useLocalStorage('pos_sales', []);
      const [purchasesHistory, setPurchasesHistory] = useLocalStorage('pos_purchases', []);
      const [expensesHistory, setExpensesHistory] = useLocalStorage('pos_expenses', []);
      const [wageTransactions, setWageTransactions] = useLocalStorage('pos_wages', []);

      // ===== POS STATE =====
      const [selectedCustomer, setSelectedCustomer] = useState(customers[0]);
      const [cart, setCart] = useState([]);
      const [parkedBills, setParkedBills] = useState([]);
      const [paymentStatus, setPaymentStatus] = useState('PAID'); // 'PAID' หรือ 'UNPAID'

      // Numpad State
      const [activeProduct, setActiveProduct] = useState(null);
      const [activeInput, setActiveInput] = useState('weight');
      const [weightInput, setWeightInput] = useState('');
      const [priceInput, setPriceInput] = useState('');

      // Modal States
      const [showCustomerModal, setShowCustomerModal] = useState(false);
      const [newCustomerName, setNewCustomerName] = useState('');
      const [showSuccess, setShowSuccess] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);

      // Print / Slip Modal State
      const [viewingSlip, setViewingSlip] = useState(null);

      // History Filter & Multi-select State
      const [historyFilterPeriod, setHistoryFilterPeriod] = useState('today'); // today, week, month, 6months
      const [historyFilterCustomer, setHistoryFilterCustomer] = useState('ALL');
      const [historyFilterStatus, setHistoryFilterStatus] = useState('ALL');
      const [selectedUnpaidBills, setSelectedUnpaidBills] = useState([]);

      // Date & Time
      const todayDateObj = new Date();
      const todayDate = todayDateObj.toLocaleDateString('th-TH', { year: 'numeric', month: '2-digit', day: '2-digit' });
      const currentTime = todayDateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

      const products = [
        { id: 1, name: 'ปลาดุก', unit: 'กก.' },
        { id: 2, name: 'ปลาช่อน', unit: 'กก.' },
        { id: 3, name: 'ปลานิล', unit: 'กก.' },
        { id: 4, name: 'เกลือ', unit: 'ถุง' },
      ];

      // ===== MANAGEMENT FUNCTIONS =====
      const handleAddCustomer = () => {
        if (!newCustomerName.trim()) return;
        const newCust = { id: Date.now(), name: newCustomerName.trim(), prices: {} };
        setCustomers([...customers, newCust]);
        setSelectedCustomer(newCust);
        setNewCustomerName('');
      };

      const handleDeleteCustomer = (id) => {
        if (id === 1) return alert('ไม่สามารถลบหน้าร้านทั่วไปได้');
        if (confirm('ยืนยันลบรายชื่อลูกค้านี้?')) {
          setCustomers(customers.filter(c => c.id !== id));
          if (selectedCustomer.id === id) setSelectedCustomer(customers[0]);
        }
      };

      const handleAddSupplier = (name) => {
        if (!name.trim()) return;
        setSuppliers([...suppliers, { id: Date.now(), name: name.trim() }]);
      };

      const handleDeleteSupplier = (id) => {
        if (confirm('ยืนยันลบรายชื่อแพปลานี้?')) {
          setSuppliers(suppliers.filter(s => s.id !== id));
        }
      };

      const handleAddEmployee = (name, wage) => {
        if (!name.trim()) return;
        setEmployees([...employees, { id: Date.now(), name: name.trim(), dailyWage: parseFloat(wage) || 300 }]);
      };

      const handleDeleteEmployee = (id) => {
        if (confirm('ยืนยันลบรายชื่อพนักงานคนนี้?')) {
          setEmployees(employees.filter(e => e.id !== id));
        }
      };

      // ===== POS LOGIC =====
      const handleOpenNumpad = (product) => {
        setActiveProduct(product);
        setActiveInput('weight');
        setWeightInput('');
        const customPrice = selectedCustomer.prices?.[product.id] || '';
        setPriceInput(customPrice ? customPrice.toString() : '');
      };

      const handleNumpadPress = (val) => {
        const currentVal = activeInput === 'weight' ? weightInput : priceInput;
        const setVal = activeInput === 'weight' ? setWeightInput : setPriceInput;
        if (val === 'CLEAR') setVal('');
        else if (val === 'DEL') setVal(currentVal.slice(0, -1));
        else if (val === '.') { if (!currentVal.includes('.')) setVal(currentVal + '.'); }
        else setVal(currentVal + val);
      };

      const handleAddToCart = () => {
        const weight = parseFloat(weightInput) || 0;
        const price = parseFloat(priceInput) || 0;
        if (weight <= 0 || price <= 0) return alert('กรุณากรอกน้ำหนักและราคาให้ถูกต้อง');

        setCart([...cart, {
          cartItemId: Date.now(),
          id: activeProduct.id,
          name: activeProduct.name,
          unit: activeProduct.unit,
          weight,
          pricePerUnit: price,
          total: weight * price
        }]);
        setActiveProduct(null);
      };

      const handleSaveBill = (status = 'PAID') => {
        if (cart.length === 0) return;
        const newBill = {
          id: `BILL-${Date.now().toString().slice(-6)}`,
          customerName: selectedCustomer.name,
          customerId: selectedCustomer.id,
          items: cart,
          totalAmount: cart.reduce((sum, item) => sum + item.total, 0),
          status: status, // 'PAID' or 'UNPAID'
          date: todayDate,
          time: currentTime,
          timestamp: Date.now()
        };

        setSalesHistory([newBill, ...salesHistory]);
        setShowSuccess(true);
        setTimeout(() => {
          setShowSuccess(false);
          setCart([]);
          setSelectedCustomer(customers[0]);
          setPaymentStatus('PAID');
        }, 800);
      };

      // ===== COMBINE BILLS LOGIC =====
      const handleCombineUnpaidBills = () => {
        if (selectedUnpaidBills.length === 0) return alert('กรุณาเลือกบิลค้างชำระอย่างน้อย 1 บิล');
        const billsToCombine = salesHistory.filter(b => selectedUnpaidBills.includes(b.id));
        const totalCombined = billsToCombine.reduce((sum, b) => sum + b.totalAmount, 0);

        const combinedSlip = {
          id: `SUMMARY-${Date.now().toString().slice(-4)}`,
          customerName: billsToCombine[0].customerName,
          billsCount: billsToCombine.length,
          bills: billsToCombine,
          totalAmount: totalCombined,
          date: todayDate,
          time: currentTime,
          isCombined: true
        };

        setViewingSlip(combinedSlip);
      };

      const handleMarkCombinedAsPaid = (billIds) => {
        setSalesHistory(salesHistory.map(b => billIds.includes(b.id) ? { ...b, status: 'PAID' } : b));
        setSelectedUnpaidBills([]);
        setViewingSlip(null);
        alert('อัปเดตสถานะเป็น "จ่ายแล้ว" เรียบร้อย!');
      };

      // ===== ANALYTICS LOGIC =====
      const filterDataByPeriod = (dataList, period) => {
        const now = Date.now();
        const oneDay = 24 * 60 * 60 * 1000;
        return dataList.filter(item => {
          const diffDays = (now - (item.timestamp || now)) / oneDay;
          if (period === 'today') return diffDays <= 1;
          if (period === 'week') return diffDays <= 7;
          if (period === 'month') return diffDays <= 30;
          if (period === '6months') return diffDays <= 180;
          return true;
        });
      };

      // คำนวณสรุปยอด
      const filteredSales = filterDataByPeriod(salesHistory, historyFilterPeriod);
      const filteredPurchases = filterDataByPeriod(purchasesHistory, historyFilterPeriod);
      const filteredExpenses = filterDataByPeriod(expensesHistory, historyFilterPeriod);
      const filteredWages = filterDataByPeriod(wageTransactions, historyFilterPeriod);

      const totalRevenue = filteredSales.filter(s => s.status === 'PAID').reduce((sum, s) => sum + s.totalAmount, 0);
      const totalUnpaid = filteredSales.filter(s => s.status === 'UNPAID').reduce((sum, s) => sum + s.totalAmount, 0);
      const totalPurchasesCost = filteredPurchases.reduce((sum, p) => sum + p.totalCost, 0);
      const totalExpensesCost = filteredExpenses.reduce((sum, e) => sum + e.amount, 0);
      const totalWagesCost = filteredWages.reduce((sum, w) => sum + w.amount, 0);
      const netProfit = totalRevenue - (totalPurchasesCost + totalExpensesCost + totalWagesCost);

      return (
        <div class="h-full flex flex-col justify-between max-w-[1366px] mx-auto p-2">
          
          {/* HEADER NAV */}
          <header class="bg-slate-900 text-white p-2.5 rounded-2xl shadow-lg flex justify-between items-center mb-2">
            <div class="flex items-center space-x-3">
              <button onClick={() => setCurrentTab('pos')} class="bg-blue-600 hover:bg-blue-700 px-3.5 py-2 rounded-xl text-lg font-bold flex items-center space-x-2 active:scale-95 transition">
                <span>🏠 หน้าหลัก</span>
              </button>
              <span class="text-2xl font-bold border-l pl-3 border-slate-700 text-blue-400">ร้านปลาเม้า V.2</span>
            </div>

            <div class="flex space-x-1.5 bg-slate-800 p-1 rounded-xl text-sm font-bold">
              <button onClick={() => setCurrentTab('pos')} class={`px-3 py-2 rounded-lg transition ${currentTab === 'pos' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:text-white'}`}>🛒 ออกบิลขาย</button>
              <button onClick={() => setCurrentTab('history')} class={`px-3 py-2 rounded-lg transition ${currentTab === 'history' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:text-white'}`}>📜 ประวัติบิล & รวมบิล</button>
              <button onClick={() => setCurrentTab('purchases')} class={`px-3 py-2 rounded-lg transition ${currentTab === 'purchases' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:text-white'}`}>📦 ซื้อเข้า</button>
              <button onClick={() => setCurrentTab('expenses')} class={`px-3 py-2 rounded-lg transition ${currentTab === 'expenses' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:text-white'}`}>💸 รายจ่าย/ค่าจ้าง</button>
              <button onClick={() => setCurrentTab('analytics')} class={`px-3 py-2 rounded-lg transition ${currentTab === 'analytics' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:text-white'}`}>📊 สรุปบัญชี</button>
            </div>

            <div class="text-right text-xs text-slate-300 font-medium">
              <div>📅 {todayDate}</div>
              <div>⏰ {currentTime} น.</div>
            </div>
          </header>

          {/* TAB 1: 🛒 ออกบิลขาย (POS) */}
          {currentTab === 'pos' && (
            <div class="grid grid-cols-12 gap-3 flex-1 overflow-hidden">
              <div class="col-span-7 flex flex-col space-y-3 h-full overflow-y-auto pr-1">
                
                {/* 1. เลือกลูกค้า */}
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200">
                  <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold text-slate-800">1. เลือกลูกค้า</h2>
                    <span class="text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">เลือกอยู่: {selectedCustomer.name}</span>
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <button onClick={() => setSelectedCustomer(customers[0])} class={`py-3.5 text-xl font-bold rounded-2xl border-2 transition ${selectedCustomer.id === 1 ? 'bg-blue-600 text-white border-blue-600 shadow' : 'bg-slate-50 text-slate-700 border-slate-200'}`}>
                      🏪 หน้าร้านทั่วไป
                    </button>
                    <button onClick={() => setShowCustomerModal(true)} class={`py-3.5 text-xl font-bold rounded-2xl border-2 transition ${selectedCustomer.id !== 1 ? 'bg-emerald-600 text-white border-emerald-600 shadow' : 'bg-emerald-50 text-emerald-800 border-emerald-300'}`}>
                      🤝 ลูกค้าประจำ {selectedCustomer.id !== 1 ? `(${selectedCustomer.name})` : ''}
                    </button>
                  </div>
                </div>

                {/* 2. เลือกสินค้า */}
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex-1">
                  <h2 class="text-lg font-bold text-slate-800 mb-2">2. กดเลือกสินค้าเพื่อชั่งน้ำหนัก</h2>
                  <div class="grid grid-cols-2 gap-3">
                    {products.map(prod => (
                      <button key={prod.id} onClick={() => handleOpenNumpad(prod)} class="bg-sky-50 border-2 border-sky-400 hover:bg-sky-100 p-5 rounded-2xl flex flex-col items-center justify-center active:scale-95 transition">
                        <span class="text-3xl font-extrabold text-slate-900">{prod.name}</span>
                        <span class="text-xs text-sky-700 font-bold mt-1">หน่วย: {prod.unit}</span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* บิลพกไว้ */}
                {parkedBills.length > 0 && (
                  <div class="bg-amber-50 border-2 border-amber-300 p-2.5 rounded-2xl flex items-center space-x-2">
                    <span class="text-xs font-bold text-amber-900 whitespace-nowrap">⏸️ พักไว้ ({parkedBills.length}):</span>
                    <div class="flex space-x-2 overflow-x-auto">
                      {parkedBills.map(p => (
                        <button key={p.id} onClick={() => { setSelectedCustomer(p.customer); setCart(p.cart); setParkedBills(parkedBills.filter(x => x.id !== p.id)); }} class="bg-amber-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap">
                          คุณ {p.customer.name} ({p.cart.length} รายการ)
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* ฝั่งขวา: สลิป & ปุ่มบันทึก */}
              <div class="col-span-5 flex flex-col justify-between h-full bg-white p-3.5 rounded-2xl border-2 border-slate-200 shadow-sm overflow-hidden">
                <div id="receipt-slip" class="bg-white p-3 rounded-xl border border-slate-300 text-slate-800 space-y-2 flex-1 overflow-y-auto">
                  <div class="text-center pb-1">
                    <h2 class="text-xl font-bold text-black">ร้านปลาเม้า</h2>
                    <p class="text-xs text-slate-500">ใบเสร็จรับเงิน / บิลเงินสด</p>
                  </div>
                  <div class="flex justify-between text-xs text-slate-600 border-y py-1">
                    <span>ลูกค้า: <strong>{selectedCustomer.name}</strong></span>
                    <span>วันที่: {todayDate}</span>
                  </div>

                  <div class="min-h-[100px] space-y-1.5 text-sm pt-1">
                    {cart.length === 0 ? (
                      <div class="text-center py-8 text-slate-400 text-xs">👈 กดเลือกสินค้าเพื่อเริ่มออกบิล</div>
                    ) : (
                      cart.map(item => (
                        <div key={item.cartItemId} class="flex justify-between items-center hover:bg-slate-50 p-1 rounded">
                          <div>
                            <span class="font-bold mr-1">{item.weight}</span>
                            <span>{item.name} ({item.pricePerUnit}฿)</span>
                          </div>
                          <div class="flex items-center space-x-2">
                            <span class="font-bold">{item.total.toLocaleString()}฿</span>
                            <button onClick={() => setCart(cart.filter(c => c.cartItemId !== item.cartItemId))} class="text-red-500 font-bold px-1">✕</button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <div class="border-t pt-2 space-y-1 text-sm">
                    <div class="flex justify-between text-lg font-bold text-black">
                      <span>รวมทั้งสิ้น</span>
                      <span class="text-2xl font-extrabold border-b-2 border-black">{cart.reduce((sum, i) => sum + i.total, 0).toLocaleString()} บาท</span>
                    </div>
                  </div>
                </div>

                {/* เลือกสถานะชำระเงินก่อนบันทึก */}
                <div class="grid grid-cols-2 gap-2 my-2">
                  <button onClick={() => setPaymentStatus('PAID')} class={`py-2 text-sm font-bold rounded-xl border-2 ${paymentStatus === 'PAID' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-600'}`}>
                    🟢 จ่ายทันที
                  </button>
                  <button onClick={() => setPaymentStatus('UNPAID')} class={`py-2 text-sm font-bold rounded-xl border-2 ${paymentStatus === 'UNPAID' ? 'bg-red-600 text-white border-red-600' : 'bg-slate-50 text-slate-600'}`}>
                    🔴 ค้างชำระ (ติดไว้)
                  </button>
                </div>

                {/* ปุ่มแอคชั่น */}
                <div class="grid grid-cols-3 gap-2 pt-1 border-t">
                  <button onClick={() => { setParkedBills([...parkedBills, { id: Date.now(), customer: selectedCustomer, cart }]); setCart([]); }} disabled={cart.length === 0} class="py-3 bg-amber-500 text-white font-bold rounded-xl text-xs">⏸️ พักบิล</button>
                  <button onClick={() => window.print()} disabled={cart.length === 0} class="py-3 bg-blue-600 text-white font-bold rounded-xl text-xs">🖨️ พิมพ์</button>
                  <button onClick={() => handleSaveBill(paymentStatus)} disabled={cart.length === 0} class="py-3 bg-emerald-600 text-white font-bold rounded-xl text-xs">✅ บันทึกบิล</button>
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: 📜 ประวัติบิล & รวมบิลค้างชำระ */}
          {currentTab === 'history' && (
            <div class="bg-white p-5 rounded-2xl shadow border flex-1 flex flex-col overflow-hidden space-y-3">
              <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-xl font-bold text-slate-800">📜 ประวัติการขาย & รวมบิลค้างชำระ</h2>
                
                {/* ตัวกรองช่วงเวลา */}
                <div class="flex space-x-2">
                  {[['today', 'วันนี้'], ['week', '7 วัน'], ['month', 'เดือนนี้'], ['6months', '6 เดือน']].map(([key, label]) => (
                    <button key={key} onClick={() => setHistoryFilterPeriod(key)} class={`px-3 py-1.5 rounded-xl text-xs font-bold ${historyFilterPeriod === key ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                      {label}
                    </button>
                  ))}
                </div>
              </div>

              {/* ตัวกรองย่อย & ปุ่มรวมบิล */}
              <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                <div class="flex space-x-3 text-sm">
                  <div>
                    <span class="font-bold text-slate-700 mr-2">ลูกค้า:</span>
                    <select value={historyFilterCustomer} onChange={(e) => setHistoryFilterCustomer(e.target.value)} class="p-1.5 rounded-lg border font-bold">
                      <option value="ALL">ทั้งหมด</option>
                      {customers.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <span class="font-bold text-slate-700 mr-2">สถานะ:</span>
                    <select value={historyFilterStatus} onChange={(e) => setHistoryFilterStatus(e.target.value)} class="p-1.5 rounded-lg border font-bold">
                      <option value="ALL">ทั้งหมด</option>
                      <option value="PAID">🟢 จ่ายแล้ว</option>
                      <option value="UNPAID">🔴 ค้างชำระ</option>
                    </select>
                  </div>
                </div>

                {/* ปุ่มรวมบิล */}
                {selectedUnpaidBills.length > 0 && (
                  <button onClick={handleCombineUnpaidBills} class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-4 py-2 rounded-xl text-sm shadow animate-pulse">
                    🧾 รวมบิลค้างชำระ ({selectedUnpaidBills.length} ใบ)
                  </button>
                )}
              </div>

              {/* ตารางประวัติบิล */}
              <div class="flex-1 overflow-y-auto border rounded-xl">

          {viewingSlip && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white p-6 rounded-3xl max-w-sm w-full shadow-2xl space-y-4">
                <div id="printable-slip" class="bg-white p-4 border rounded-xl space-y-2 text-slate-800">
                  <div class="text-center pb-2 border-b">
                    <h2 class="text-xl font-bold">ร้านปลาเม้า</h2>
                    <p class="text-xs text-slate-500">{viewingSlip.isCombined ? '*** สลิปรวมยอดค้างชำระ ***' : 'สลิปรายการขาย'}</p>
                  </div>
                  <div class="text-xs space-y-1">
                    <div>ลูกค้า: <strong>{viewingSlip.customerName}</strong></div>
                    <div>วันที่: {viewingSlip.date} {viewingSlip.time}</div>
                  </div>
                  <div class="border-t border-b py-2 space-y-1 text-sm">
                    {viewingSlip.isCombined ? (
                      viewingSlip.bills.map(b => (
                        <div key={b.id} class="flex justify-between text-xs">
                          <span>บิล {b.id} ({b.date})</span>
                          <span class="font-bold">{b.totalAmount.toLocaleString()}฿</span>
                        </div>
                      ))
                    ) : (
                      viewingSlip.items?.map((item, idx) => (
                        <div key={idx} class="flex justify-between text-xs">
                          <span>{item.weight} {item.name}</span>
                          <span class="font-bold">{item.total.toLocaleString()}฿</span>
                        </div>
                      ))
                    )}
                  </div>
                  <div class="flex justify-between text-base font-bold text-black pt-1">
                    <span>ยอดรวมสุทธิ</span>
                    <span class="text-xl font-extrabold">{viewingSlip.totalAmount.toLocaleString()} บาท</span>
                  </div>
                </div>

                <div class="space-y-2">
                  {viewingSlip.isCombined && (
                    <button onClick={() => handleMarkCombinedAsPaid(viewingSlip.bills.map(b => b.id))} class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl text-sm shadow">
                      🟢 ชำระแล้ว (ปรับเป็นจ่ายแล้วทุกบิล)
                    </button>
                  )}
                  <div class="flex space-x-2">
                    <button onClick={() => window.print()} class="flex-1 py-2.5 bg-blue-600 text-white font-bold rounded-xl text-xs">🖨️ พิมพ์</button>
                    <button onClick={() => setViewingSlip(null)} class="flex-1 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">ปิด</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* SUCCESS NOTIFICATION */}
          {showSuccess && (
            <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div class="bg-white p-6 rounded-3xl text-center space-y-2 shadow-2xl animate-bounce">
                <div class="text-5xl">🎉</div>
                <div class="text-2xl font-bold text-slate-800">บันทึกเรียบร้อย!</div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>
</html>
